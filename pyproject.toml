[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-safety-vision"
version = "0.1.0"
description = "Production-style computer vision system for industrial workplace safety monitoring."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Illia Sator" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "ultralytics>=8.1",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
]
onnx = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
